name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^dependabot/ ]]; then exit 0; fi
          if [[ ! "$BRANCH" =~ ^[a-z0-9-]+/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Branch must be <scope>/<topic>, got: $BRANCH"
            exit 1
          fi

  commit-messages:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^[A-Z0-9-]+:\ .{1,75}$ ]]; then
              echo "Invalid commit message: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $failed

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
